name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Space (without PDFs)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf .git docs/pdf .github
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Deploy from GitHub ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/cogsciup/guidelines" main
